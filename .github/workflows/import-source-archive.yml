name: Import Business ERP source archive

on:
  push:
    branches: [main]
    paths:
      - 'transfer/IMPORT.trigger'

permissions:
  contents: write

jobs:
  import-source:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Decode and import source files
        shell: bash
        run: |
          set -euo pipefail
          cat transfer/part-00.b64 transfer/part-01.b64 transfer/part-02.b64 transfer/part-03.b64 transfer/part-04.b64 transfer/part-05.b64 transfer/part-06.b64 transfer/part-07.b64 transfer/part-08.b64 transfer/part-09.b64 transfer/part-10.b64 transfer/part-11.b64 transfer/part-12.b64 transfer/part-13.b64 transfer/part-14a.b64 transfer/part-14b.b64 transfer/part-15a.b64 transfer/part-15b1.b64 transfer/tail-01.b64 transfer/tail-02.b64 transfer/tail-03.b64 transfer/tail-04.b64 transfer/tail-05.b64 transfer/tail-06.b64 transfer/tail-07.b64 transfer/tail-08.b64 transfer/tail-09.b64 transfer/tail-10.b64 transfer/tail-11.b64 transfer/tail-12a.b64 transfer/tail-12b.b64 transfer/tail-13.b64 transfer/tail-14.b64 transfer/tail-15.b64 transfer/tail-16.b64 transfer/tail-17.b64 transfer/tail-18.b64 transfer/part-15b2b.b64 > "$RUNNER_TEMP/business-erp.zip.b64"
          base64 --decode "$RUNNER_TEMP/business-erp.zip.b64" > "$RUNNER_TEMP/business-erp.zip"
          mkdir -p "$RUNNER_TEMP/archive"
          unzip -q "$RUNNER_TEMP/business-erp.zip" -d "$RUNNER_TEMP/archive"
          test -d "$RUNNER_TEMP/archive/business-erp"
          cp -a "$RUNNER_TEMP/archive/business-erp/." .
          rm -rf transfer
          rm -f .github/workflows/ci.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No source changes were imported."
            exit 1
          fi
          git commit -m "Import complete Business ERP C# source"
          git push origin HEAD:main
